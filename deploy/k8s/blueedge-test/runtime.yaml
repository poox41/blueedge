apiVersion: v1
kind: Namespace
metadata:
  name: blueedge-test
  labels:
    blueedge.io/environment: test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blueedge-dashboard
  namespace: blueedge-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blueedge-dashboard-test-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: blueedge-dashboard
    namespace: blueedge-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blueedge-config
  namespace: blueedge-test
data:
  ADMIN_USERNAME: admin
  BFF_BASE_URL: http://blueedge-bff.blueedge.svc.cluster.local:8080/api/v1
  JWT_EXPIRES_IN: 30d
  K8S_API_SERVER: https://kubernetes.default.svc
  K8S_SKIP_TLS_VERIFY: "true"
  BLUEEDGE_SYSTEM_NAMESPACE: blueedge-system
  KUBEEDGE_TOKEN_MIN_VALIDITY_SECONDS: "300"
  KUBEEDGE_TOKEN_SECRET_KEY: tokendata
  KUBEEDGE_TOKEN_SECRET_NAME: tokensecret
  KUBEEDGE_TOKEN_SECRET_NAMESPACE: kubeedge
  MODEL_REGISTRY_URL: https://183.95.195.121:31438
  MODEL_REGISTRY_PREFIX: app
  MODEL_REGISTRY_SKIP_TLS_VERIFY: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blueedge-api-gateway
  namespace: blueedge-test
  labels:
    app: blueedge-api-gateway
    blueedge.io/environment: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blueedge-api-gateway
  template:
    metadata:
      labels:
        app: blueedge-api-gateway
        blueedge.io/environment: test
    spec:
      serviceAccountName: blueedge-dashboard
      imagePullSecrets:
        - name: blueedge-registry-secret
        - name: acr-pull-secret
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      containers:
        - name: blueedge-api-gateway
          image: 183.95.195.121:31438/blueedge/api-gateway:2026071704
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "7001"
          envFrom:
            - configMapRef:
                name: blueedge-config
            - secretRef:
                name: blueedge-secret
          ports:
            - name: http
              containerPort: 7001
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: blueedge-api-gateway
  namespace: blueedge-test
spec:
  selector:
    app: blueedge-api-gateway
  ports:
    - name: http
      port: 7001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blueedge-frontend
  namespace: blueedge-test
  labels:
    app: blueedge-frontend
    blueedge.io/environment: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blueedge-frontend
  template:
    metadata:
      labels:
        app: blueedge-frontend
        blueedge.io/environment: test
    spec:
      imagePullSecrets:
        - name: blueedge-registry-secret
        - name: acr-pull-secret
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      containers:
        - name: blueedge-frontend
          image: 183.95.195.121:31438/blueedge/frontend:2026071704
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: blueedge-frontend
  namespace: blueedge-test
spec:
  type: NodePort
  selector:
    app: blueedge-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
