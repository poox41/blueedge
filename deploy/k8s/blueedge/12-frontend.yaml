apiVersion: apps/v1
kind: Deployment
metadata:
  name: blueedge-frontend
  namespace: blueedge
  labels:
    app: blueedge-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blueedge-frontend
  template:
    metadata:
      labels:
        app: blueedge-frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      containers:
        - name: blueedge-frontend
          image: blueedge-frontend:amd64
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: blueedge-frontend
  namespace: blueedge
  labels:
    app: blueedge-frontend
spec:
  type: NodePort
  selector:
    app: blueedge-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
