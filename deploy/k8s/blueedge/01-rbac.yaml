apiVersion: v1
kind: ServiceAccount
metadata:
  name: blueedge-dashboard
  namespace: blueedge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blueedge-dashboard-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: blueedge-dashboard
    namespace: blueedge

