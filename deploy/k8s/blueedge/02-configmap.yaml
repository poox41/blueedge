apiVersion: v1
kind: ConfigMap
metadata:
  name: blueedge-config
  namespace: blueedge
data:
  ADMIN_USERNAME: "admin"
  JWT_EXPIRES_IN: "30d"
  JWT_ISSUER: "blueedge"
  JWT_AUDIENCE: "blueedge-api"
  BFF_BASE_URL: "http://blueedge-bff:8080/api/v1"
  K8S_API_SERVER: "https://kubernetes.default.svc"
  K8S_SKIP_TLS_VERIFY: "true"
  K8S_CA_FILE: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
  BAMS_SSO_ENABLED: "false"
  BAMS_SSO_BASE_URL: "https://bams.example.com"
  ALLOW_INSECURE_TEST_HTTP: "false"
  BAMS_SSO_EXCHANGE_PATH: "/v1/sso/blueedge/exchange"
  BAMS_SSO_CLIENT_ID: "blueedge"
  BAMS_SSO_REQUEST_TIMEOUT_MS: "5000"
  BAMS_SSO_JWT_EXPIRES_IN: "8h"
  CORS_ALLOWED_ORIGINS: ""
  TRUST_PROXY_HOPS: "1"
  AUTH_RATE_LIMIT_WINDOW_MS: "60000"
  LOGIN_RATE_LIMIT_MAX: "20"
  SSO_RATE_LIMIT_MAX: "20"
  BLUEEDGE_SYSTEM_NAMESPACE: "blueedge-system"
  KUBEEDGE_TOKEN_SECRET_NAMESPACE: "kubeedge"
  KUBEEDGE_TOKEN_SECRET_NAME: "tokensecret"
  KUBEEDGE_TOKEN_SECRET_KEY: "tokendata"
  KUBEEDGE_TOKEN_MIN_VALIDITY_SECONDS: "300"
  MODEL_REGISTRY_URL: "https://183.95.195.121:31438"
  MODEL_REGISTRY_PREFIX: "app"
  MODEL_REGISTRY_SKIP_TLS_VERIFY: "true"
  # Production startup requires an immutable, explicitly versioned Triton runtime image.
  TRITON_AMD64_RUNTIME_IMAGE: "m.daocloud.io/nvcr.io/nvidia/tritonserver:26.03-pyt-python-py3"
  # ARM64/Jetson Triton runtime. Verified as linux/arm64; keep the tag pinned.
  TRITON_ARM64_RUNTIME_IMAGE: "m.daocloud.io/nvcr.io/nvidia/tritonserver:26.02-py3-igpu"
