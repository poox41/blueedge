apiVersion: v1
kind: Secret
metadata:
  name: blueedge-secret
  namespace: blueedge
type: Opaque
stringData:
  ADMIN_PASSWORD: "replace-with-blueedge-admin-password"
  JWT_SECRET: "replace-with-openssl-rand-hex-32-output"
  MODEL_REGISTRY_USERNAME: "replace-with-registry-username"
  MODEL_REGISTRY_PASSWORD: "replace-with-registry-password"
