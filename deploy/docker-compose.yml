services:
  blueedge-frontend:
    image: blueedge-frontend:${BLUEEDGE_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_BFF_BASE_URL: /product-api/bff
        VITE_GATEWAY_BASE_URL: /product-api
    container_name: blueedge-frontend
    depends_on:
      - blueedge-api-gateway
    ports:
      - "${BLUEEDGE_HTTP_PORT:-3000}:80"
    restart: unless-stopped

  blueedge-api-gateway:
    image: blueedge-api-gateway:${BLUEEDGE_IMAGE_TAG:-latest}
    build:
      context: ../server/api-gateway
      dockerfile: Dockerfile
    container_name: blueedge-api-gateway
    environment:
      PORT: 7001
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      JWT_ISSUER: ${JWT_ISSUER:-blueedge}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-blueedge-api}
      BFF_BASE_URL: http://blueedge-bff:8080/api/v1
      K8S_API_SERVER: ${K8S_API_SERVER:?K8S_API_SERVER is required}
      K8S_SKIP_TLS_VERIFY: ${K8S_SKIP_TLS_VERIFY:-true}
      K8S_TOKEN: ${K8S_TOKEN:?K8S_TOKEN is required}
      K8S_CA_FILE: ${K8S_CA_FILE:-}
      BAMS_SSO_ENABLED: ${BAMS_SSO_ENABLED:-false}
      BAMS_SSO_BASE_URL: ${BAMS_SSO_BASE_URL:-}
      BAMS_SSO_EXCHANGE_PATH: ${BAMS_SSO_EXCHANGE_PATH:-/v1/sso/blueedge/exchange}
      BAMS_SSO_CLIENT_ID: ${BAMS_SSO_CLIENT_ID:-blueedge}
      BAMS_SSO_CLIENT_SECRET: ${BAMS_SSO_CLIENT_SECRET:-}
      BAMS_SSO_REQUEST_TIMEOUT_MS: ${BAMS_SSO_REQUEST_TIMEOUT_MS:-5000}
      BAMS_SSO_JWT_EXPIRES_IN: ${BAMS_SSO_JWT_EXPIRES_IN:-8h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-20}
      SSO_RATE_LIMIT_MAX: ${SSO_RATE_LIMIT_MAX:-20}
      KUBEEDGE_TOKEN_SECRET_NAMESPACE: ${KUBEEDGE_TOKEN_SECRET_NAMESPACE:-kubeedge}
      KUBEEDGE_TOKEN_SECRET_NAME: ${KUBEEDGE_TOKEN_SECRET_NAME:-tokensecret}
      KUBEEDGE_TOKEN_SECRET_KEY: ${KUBEEDGE_TOKEN_SECRET_KEY:-tokendata}
      KUBEEDGE_TOKEN_MIN_VALIDITY_SECONDS: ${KUBEEDGE_TOKEN_MIN_VALIDITY_SECONDS:-300}
      MODEL_REGISTRY_URL: ${MODEL_REGISTRY_URL:-https://183.95.195.121:31438}
      MODEL_REGISTRY_USERNAME: ${MODEL_REGISTRY_USERNAME:-}
      MODEL_REGISTRY_PASSWORD: ${MODEL_REGISTRY_PASSWORD:-}
      MODEL_REGISTRY_PREFIX: ${MODEL_REGISTRY_PREFIX:-app}
      MODEL_REGISTRY_SKIP_TLS_VERIFY: ${MODEL_REGISTRY_SKIP_TLS_VERIFY:-true}
    depends_on:
      - blueedge-bff
    restart: unless-stopped

  blueedge-bff:
    image: blueedge-bff:${BLUEEDGE_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/bff.Dockerfile
    container_name: blueedge-bff
    command:
      - --apiserver-host=${K8S_API_SERVER:?K8S_API_SERVER is required}
      - --apiserver-skip-tls-verify=${K8S_SKIP_TLS_VERIFY:-true}
      - --insecure-bind-address=0.0.0.0
      - --insecure-port=8080
    restart: unless-stopped
